<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>tp-0910</title>
  </head>
  <body>
    <h1>Partie de dés</h1>

    <form id="form-partie">
        <label for="joueur1">Premier joueur :</label>
        <input id="joueur1" type="text" placeholder="Joueur 1" required>

        <label for="joueur2">Deuxième joueur :</label>
        <input id="joueur2" type="text" placeholder="Joueur 2" required>

        <label for="nbrTour">Nombre de tours :</label>
        <input id="nbrTour" type="number" min="1" step="1" value="5" required>

        <button id="lancer" type="submit">Lancer la partie</button>
    </form>

    <p id="erreur" role="alert"></p>
    <p id="p1"></p>
    <script type="module" src="main.js"></script>
  </body>
</html>
